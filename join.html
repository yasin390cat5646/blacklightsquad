<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درخواست عضویت | BLACKLIGHT</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="script.js"></script></head><body><header class="top"><a class="brand" href="index.html">BLACK<span>LIGHT</span></a><a href="index.html">صفحه اصلی</a></header><main class="narrow"><section class="panel"><p class="eyebrow">JOIN THE SQUAD</p><h1>فرم درخواست عضویت</h1><form id="joinForm"><label>یوزرنیم یا آیدی داخل بازی<input name="game_username" required maxlength="80"></label><label>سن واقعی<input name="real_age" type="number" min="10" max="99" required></label><label>هدفت از عضویت در اسکواد چیست؟<textarea name="join_goal" required maxlength="1000"></textarea></label><label>آیدی روبیکا (دقیق)<input name="rubika_id" required maxlength="80"></label><label>برای کدام بازی تست می‌دهی؟<input name="game_test" required maxlength="80"></label><label>مهارتت را از ۰ تا ۱۰ ارزیابی کن<input name="skill_rating" type="number" min="0" max="10" required></label><p class="muted">شرایط: حداقل سن ۱۰ سال، مهارت مناسب در بازی و توانایی شرکت در ایونت‌های داخلی. ممکن است همه متقاضیان واجد شرایط نباشند.</p><button class="btn primary" type="submit">ارسال درخواست</button></form><p id="joinMessage" class="message" aria-live="polite"></p><p class="muted">درصورت تایید فرم لینک ورود به ایدی شما ارسال میشود</p></section></main></body></html>
