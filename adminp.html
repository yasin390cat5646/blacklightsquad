<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | BLACKLIGHT</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="script.js"></script></head><body><header class="top"><a class="brand" href="index.html">BLACK<span>LIGHT</span></a><div><span id="whoami" class="muted"></span> <button id="logoutBtn" class="btn ghost small">خروج</button></div></header><main><section class="panel"><p class="eyebrow">CONTROL CENTER</p><h1>پنل مدیریت</h1><p id="adminMessage" class="message" aria-live="polite">در حال بررسی دسترسی...</p></section><section id="applicationsPanel" class="panel hidden"><h2>درخواست‌های عضویت</h2><div id="applicationsList"></div></section><section id="rankPanel" class="panel hidden"><h2>مدیریت رتبه‌ها <span class="rank">ADMIN+</span></h2><p class="muted">فقط Admin+ می‌تواند رتبه Admin را اعطا یا لغو کند.</p><form id="rankForm"><label>شناسه کاربری Supabase (UUID)<input name="user_id" required placeholder="UUID حساب کاربر"></label><label>نام کاربری نمایشی<input name="username" required maxlength="40"></label><div class="actions"><button class="btn primary" name="action" value="grant" type="submit">دادن رتبه Admin</button><button class="btn danger" name="action" value="revoke" type="submit">گرفتن رتبه Admin</button></div></form><p id="rankMessage" class="message" aria-live="polite"></p><p class="muted">برای جلوگیری از جعل، این بخش UUID حساب احراز هویت‌شده را می‌گیرد، نه صرفاً نامی که کاربر تایپ کند.</p></section></main><script>/* Buttons are wired by script.js */</script></body></html>
